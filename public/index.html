<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ross Inventory Entry</title><link rel="stylesheet" href="styles.css"></head>
<body><main><header><p class="eyebrow">ROSS INVENTORIES</p><h1>Data entry</h1><p class="lede">Add clients, stores, crew members, and completed inventories.</p></header>
<nav aria-label="Forms"><button class="active" data-form="inventory">New inventory</button><button data-form="client">New client</button><button data-form="store">New store</button><button data-form="employee">New employee</button><button data-form="records">View saved data</button></nav>
<p id="notice" role="status"></p>
<form id="inventory" class="active form-card"><h2>Inventory details</h2><div class="grid"><label>Store <select name="storeId" required></select></label><label>Inventory date <input name="inventoryDate" type="date" required></label><label>Parts manager <input name="partsManager"></label><label>Inventory lead <select name="inventoryLeadId"><option value="">Select lead (optional)</option></select></label><label>Piece count <input name="pieceCount" type="number" min="0" value="0" required></label><label>Total value <input name="totalValue" type="number" step="0.01" min="0"></label><label>Variance count <input name="varianceCount" type="number"></label><label>Write-in count <input name="writeInCount" type="number"></label><label>Inventory cost <input name="inventoryCost" type="number" step="0.01" min="0" value="0.00" required></label><label>Hours worked <input name="hoursWorked" type="number" step="0.01" min="0"></label><label>Crew size <input name="crewSize" type="number" min="0"></label><label>Status <select name="status"><option>Completed</option><option>Pending</option><option>Cancelled</option></select></label><label>Type <input name="type" value="Inventory"></label><label>Computer system <input name="computerSystem"></label><label class="full">Notes <textarea name="notes" rows="3"></textarea></label></div><button type="submit">Save inventory</button></form>
<form id="client" class="form-card"><h2>Client</h2><div class="grid"><label>Client name <input name="clientName" required></label><label>Contact name <input name="contactName"></label><label>Phone <input name="phone" type="tel"></label><label>Email <input name="email" type="email"></label><label>Status <select name="status"><option>Active</option><option>Inactive</option></select></label><label class="full">Billing address <textarea name="billingAddress" rows="3"></textarea></label></div><button type="submit">Save client</button></form>
<form id="store" class="form-card"><h2>Store</h2><div class="grid"><label>Client <select name="clientId"><option value="">No client assigned</option></select></label><label>Store name <input name="storeName"></label><label>Address <input name="address"></label><label>City <input name="city"></label><label>State <input name="state"></label><label>ZIP <input name="zip"></label></div><button type="submit">Save store</button></form>
<form id="employee" class="form-card"><h2>Employee</h2><div class="grid"><label>First name <input name="firstName" required></label><label>Last name <input name="lastName" required></label><label>Email <input name="email" type="email"></label><label>Phone <input name="phone" type="tel"></label></div><button type="submit">Save employee</button></form>
<section id="records" class="form-card"><div class="records-heading"><div><h2>Saved database information</h2><p>All operational records currently saved in the database.</p></div><button id="refresh-records" type="button">Refresh</button></div><p class="privacy-note">User password hashes are never displayed.</p><div id="record-tables"></div></section>
</main><script src="app.js"></script></body></html>
