<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign in · Ross Inventory Entry</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="login.css">
  </head>
  <body class="login-page">
    <main class="login-main">
      <form id="login-form" class="login-card">
        <p class="eyebrow">ROSS INVENTORIES</p>
        <h1>Sign in</h1>
        <p>Use your inventory account to continue.</p>
        <label>Username <input name="username" autocomplete="username" required autofocus></label>
        <label>Password <input name="password" type="password" autocomplete="current-password" required></label>
        <p id="login-error" class="error" role="alert"></p>
        <button type="submit">Sign in</button>
      </form>
    </main>
    <script>
      document.querySelector('#login-form').addEventListener('submit', async event => {
        event.preventDefault();
        const error = document.querySelector('#login-error');
        error.textContent = '';
        const response = await fetch('/api/login', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(Object.fromEntries(new FormData(event.currentTarget)))});
        const data = await response.json();
        if (!response.ok) { error.textContent = data.error || 'Could not sign in.'; return; }
        window.location.assign('/');
      });
    </script>
  </body>
</html>
